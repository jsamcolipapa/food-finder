<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crave — food nearby</title>
    <meta
      name="description"
      content="Browse restaurants and cafés around you, filter by craving, and get directions."
    />
    <meta name="theme-color" content="#fff8ef" />
    <script>
      // Apply the saved or device theme before first paint; ThemeService takes over after.
      (function () {
        var choice = 'auto';
        try {
          choice = JSON.parse(localStorage.getItem('crave:theme')) || 'auto';
        } catch (e) {}
        var dark =
          choice === 'auto'
            ? matchMedia('(prefers-color-scheme: dark)').matches
            : choice === 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
